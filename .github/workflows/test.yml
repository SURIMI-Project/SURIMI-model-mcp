name: Tests

# This workflow runs the pytest suite and a check of the tool registry.
# docker.yml calls it before it builds the image.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # docker.yml calls this workflow before it publishes the image.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The package list matches the install line in the Dockerfile, plus pytest and pytest-asyncio.
      # The fixtures need netcdf4 and h5netcdf to write NetCDF files, and without them xarray raises an error and the suite fails.
      # tests/test_artifact_route.py imports starlette.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            fastmcp==3.3.1 uvicorn starlette \
            xarray netcdf4 h5py h5netcdf numpy s3fs pyyaml \
            pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q

      # This step checks the shape of the tool registry and not a count of tools.
      # Each module must declare tools in TOOLS, every name must start with model_, and every declared tool must be defined.
      - name: Check the tool registry is consistent
        run: |
          PYTHONPATH=. SURIMI_RECEIPT_SECRET=x python -c "
          from surimi_model_mcp.tools import gridded, lookups, runs
          total = 0
          for name, mod in {'gridded': gridded, 'runs': runs, 'lookups': lookups}.items():
              assert mod.TOOLS, name + '.TOOLS is empty'
              assert all(n.startswith('model_') for n in mod.TOOLS), mod.TOOLS
              assert not any(n.startswith('nc_') for n in mod.TOOLS), mod.TOOLS
              missing = [n for n in mod.TOOLS if not hasattr(mod, n)]
              assert not missing, f'{name}: declared but not defined: {missing}'
              total += len(mod.TOOLS)
          print('registry OK:', total, 'tools in three modules, plus describe_model_capabilities')
          "
